<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gerador de orçamento</title>
<style>
:root{--bg:#EEF2F7;--paper:#fff;--ink:#1B2A41;--mute:#5d6b82;--line:#d5dce8;--acc:#1F5FBF;--acc-ink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1727;--paper:#18233A;--ink:#EAF0FA;--mute:#9db0cc;--line:#2C3B58;--acc:#5B9BFF;--acc-ink:#0F1727;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.bar{max-width:820px;margin:0 auto;padding:16px 16px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar b{flex:1;min-width:180px}
button{font:inherit;padding:10px 14px;border-radius:8px;border:1px solid var(--acc);background:transparent;color:var(--acc);cursor:pointer}
button.p{background:var(--acc);color:var(--acc-ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.doc{max-width:820px;margin:12px auto 32px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:28px}
h1{margin:0;font-size:26px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
label{display:block;font-size:13px;color:var(--mute)}
input,textarea{width:100%;font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--line);padding:6px 2px}
textarea{border:1px solid var(--line);border-radius:6px;padding:8px;min-height:72px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;margin-top:8px;min-width:560px}
th{text-align:left;font-size:13px;color:var(--mute);border-bottom:2px solid var(--ink);padding:6px 4px}
td{border-bottom:1px solid var(--line);padding:2px 4px}
td.n,th.n{text-align:right;width:110px}
td.q,th.q{width:70px}
td.x{width:44px}
.tot{margin:16px 0 0 auto;max-width:300px}
.tot div{display:flex;justify-content:space-between;align-items:center;padding:4px 0}
.tot .g{font-size:20px;font-weight:700;border-top:2px solid var(--ink);margin-top:6px;padding-top:8px}
.tot input{width:110px;text-align:right}
@media (max-width:560px){.row{grid-template-columns:1fr}.doc{padding:18px}}
@media print{body{background:#fff;color:#000}.bar,.x,.noprint{display:none!important}.doc{border:0;margin:0;padding:0;max-width:none;background:#fff}input,textarea{color:#000;border-color:#bbb}th{color:#333}:root{padding:0}}
</style>
</head>
<body>
<div class="bar noprint">
<b>Gerador de orçamento</b>
<button id="add">Adicionar item</button>
<button id="pdf" class="p">Salvar como PDF</button>
</div>
<main class="doc">
<h1>Orçamento</h1>
<div class="row">
<div><label for="emp">Seu nome ou empresa</label><input id="emp" placeholder="Ex.: João Elétrica"></div>
<div><label for="tel">Telefone</label><input id="tel" placeholder="(49) 90000-0000"></div>
<div><label for="cli">Cliente</label><input id="cli" placeholder="Nome do cliente"></div>
<div><label for="dt">Data</label><input id="dt" type="date"></div>
</div>
<div class="wrap">
<table>
<thead><tr><th>Descrição</th><th class="q">Qtd.</th><th class="n">Valor unit.</th><th class="n">Total</th><th class="x"></th></tr></thead>
<tbody id="itens"></tbody>
</table>
</div>
<div class="tot">
<div><span>Subtotal</span><span id="sub">R$ 0,00</span></div>
<div><span>Desconto (R$)</span><input id="desc" type="number" min="0" step="0.01" value="0"></div>
<div class="g"><span>Total</span><span id="tot">R$ 0,00</span></div>
</div>
<div class="row" style="grid-template-columns:1fr">
<div><label for="val">Validade do orçamento</label><input id="val" value="7 dias"></div>
<div><label for="obs">Condições de pagamento e observações</label><textarea id="obs" placeholder="Ex.: 50% na entrada e 50% na entrega."></textarea></div>
</div>
</main>
<script>
var $=function(i){return document.getElementById(i)};
var fmt=new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
$("dt").valueAsDate=new Date();
function linha(d,q,v){
  var tr=document.createElement("tr");
  tr.innerHTML='<td><input class="d" placeholder="Descrição do serviço" value="'+d+'"></td>'+
  '<td class="q"><input class="qt" type="number" min="0" step="any" value="'+q+'"></td>'+
  '<td class="n"><input class="vu" type="number" min="0" step="0.01" value="'+v+'"></td>'+
  '<td class="n"><span class="t">R$ 0,00</span></td>'+
  '<td class="x"><button aria-label="Remover item">×</button></td>';
  tr.querySelector("button").onclick=function(){tr.remove();calc()};
  $("itens").appendChild(tr);
}
function calc(){
  var s=0;
  document.querySelectorAll("#itens tr").forEach(function(tr){
    var t=(parseFloat(tr.querySelector(".qt").value)||0)*(parseFloat(tr.querySelector(".vu").value)||0);
    tr.querySelector(".t").textContent=fmt.format(t);s+=t;
  });
  $("sub").textContent=fmt.format(s);
  $("tot").textContent=fmt.format(Math.max(0,s-(parseFloat($("desc").value)||0)));
}
document.addEventListener("input",calc);
$("add").onclick=function(){linha("",1,"")};
$("pdf").onclick=function(){window.print()};
linha("",1,"");linha("",1,"");calc();
</script>
</body>
</html>
